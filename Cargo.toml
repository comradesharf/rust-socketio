[workspace]
resolver = "3"
members = ["engineio", "socketio"]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
version = "0.6.0"

[workspace.dependencies]
base64 = "0"
bytes = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = "1"
futures-util = "0"
async-stream = "0"
rustls = "0"
url = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
